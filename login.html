<DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title> جامعة الأزهر | نظام التحقق والخدمات</title>
	
	<!-- الأنماط الأساسية المقتبسة من البنية الأولى والثانية -->
	<link rel="stylesheet" id="dashicons-css" href="https://dent.horus.edu.eg/wp-includes/css/dashicons.min.css?ver=7.1.3" media="all" />
	<link rel="stylesheet" id="buttons-css" href="https://dent.horus.edu.eg/wp-includes/css/buttons.min.css?ver=7.1.3" media="all" />
	<link rel="stylesheet" id="forms-css" href="https://dent.horus.edu.eg/wp-admin/css/forms.min.css?ver=7.1.3" media="all" />
	<link rel="stylesheet" id="login-css" href="https://dent.horus.edu.eg/wp-admin/css/login.min.css?ver=7.1.3" media="all" />
	
	<link rel="icon" href="https://files.catbox.moe/52p74z.png" sizes="32x32" />

	<style>
		body.login {
			-webkit-background-size: cover !important;
			-moz-background-size: cover !important;
			-o-background-size: cover !important;
			background-size: cover !important;
			background-image: url(https://dent.horus.edu.eg/wp-content/uploads/2021/08/login-background.jpg) !important;
			background-position: center center !important;
			background-repeat: no-repeat !important;
			font-family: Tahoma, sans-serif;
		}
		#login h1 a, .login h1 a {
			background-image: url(https://files.catbox.moe/52p74z.png) !important;
			width: 150px !important;
			max-width: 100%;
			height: 150px;
			background-size: 150px 150px;
		}
		.verify-msg { margin-top: 10px; font-weight: bold; font-size: 14px; }
		.verify-msg.err { color: #d63638; }
		.verify-msg.suc { color: #00a32a; }
		.cert-container { background: #fff; padding: 20px; border-radius: 8px; margin-top: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
		.cert-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
		.cert-item { background: #f9f9f9; padding: 8px; border: 1px solid #ddd; }
		.cert-item .k { font-weight: bold; display: block; color: #555; font-size: 12px; }
		.cert-item .v { color: #222; font-size: 14px; }
		.sig-line { border-top: 1px solid #333; margin-top: 20px; padding-top: 5px; font-weight: bold; }
		.sig-role { font-size: 12px; color: #666; }
		.photo-upload-box {
			margin-top: 15px;
			padding: 10px;
			background: #f0f0f1;
			border: 1px dashed #ccc;
			border-radius: 6px;
			text-align: center;
		}
	</style>
</head>
<body class="login no-js login-action-login wp-core-ui admin-color-modern locale-ar">

	<div id="homeView">
		<h1 class="screen-reader-text">Log In &lsaquo; Faculty of Dentistry</h1>
		<div id="login">
			<h1 role="presentation" class="wp-login-logo"><a href="index.html">Faculty of Dentistry</a></h1>
		
			<form id="verifyForm">
				<p>
					<label for="nationalId">الرقم القومي (14 رقمًا)</label>
					<input type="text" id="nationalId" class="input ltr" value="" size="20" maxlength="14" required="required" />
				</p>

				<div class="user-pass-wrap">
					<label for="password">كلمة المرور</label>
					<div class="wp-pwd">
						<input type="password" id="password" class="input password-input ltr" value="" size="20" required="required" />
					</div>
				</div>

				<p class="submit">
					<button type="submit" id="verifyBtn" class="button button-primary button-large" style="width: 100%;">
						<span class="btn-label">تحقق من الشهادة</span>
					</button>
				</p>
				<p id="verifyMsg" class="verify-msg"></p>
			</form>

			<p id="backtoblog">
				<a href="index.html">&larr; العودة إلى موقع كلية عين شمس </a>
			</p>
		</div>
	</div>

	<!-- صفحة عرض الشهادة / النتيجة -->
	<div id="certPage" hidden style="max-width: 800px; margin: 40px auto; padding: 20px;">
		<div style="background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.2);">
			<button id="backToHomeCrumb" class="button" style="margin-bottom: 20px;">&larr; رجوع للبحث</button>
			
			<!-- المحتوى العادي -->
			<div id="normalCertContent">
				<div style="display: flex; align-items: center; gap: 20px; border-bottom: 2px solid #eee; padding-bottom: 15px;">
					<img id="certPhoto" src="" alt="صورة الخريج" style="width: 100px; height: 100px; object-fit: cover; border-radius: 50%; border: 2px solid #ccc;" />
					<div>
						<h2 id="certName" style="margin: 0; color: #1d2327;"></h2>
						<p id="certCollege" style="margin: 5px 0 0; color: #646970;"></p>
					</div>
				</div>

				<!-- خيار تغيير الصورة مباشرة من الصفحة -->
				<div class="photo-upload-box">
					<label style="font-weight: bold; font-size: 13px; display: block; margin-bottom: 5px;">🖼️ تغيير الصورة الشخصية:</label>
					<input type="file" id="photoInput" accept="image/*" style="font-size: 12px;" />
				</div>

				<div id="certGrid" class="cert-grid"></div>

				<div id="certSign" style="display: flex; justify-content: space-between; margin-top: 30px; text-align: center;"></div>

				<div style="margin-top: 30px; text-align: center;">
					<button id="pdfBtn" class="button button-primary button-large"><span>📄</span> التحقق من الشهادة PDF</button>
					<div id="pendingBox" hidden style="margin-top: 15px; padding: 10px; background: #f0f6fc; border: 1px solid #cce5ff;">
						<p id="pendingRef" style="margin: 0; font-weight: bold; color: #004085;"></p>
					</div>
				</div>
			</div>

			<!-- المحتوى المحظور -->
			<div id="blockedCertContent" hidden style="text-align: center; padding: 20px;">
				<img id="blockedPhoto" src="" alt="صورة" style="width: 100px; height: 100px; object-fit: cover; border-radius: 50%; margin-bottom: 15px;" />
				<h2 id="blockedName" style="color: #d63638;"></h2>
				<p id="blockedCollege" style="color: #646970;"></p>
				<div style="background: #fcf0f1; border: 1px solid #f8d7da; padding: 15px; border-radius: 5px; margin-top: 20px; color: #721c24;">
					<strong>عذراً، الملف محظور أو موقوف مؤقتاً.</strong>
					<p style="margin: 5px 0 0;">الاسم: <span id="blockedDetailName"></span> | الرقم القومي: <span id="blockedDetailId"></span></p>
					<p style="margin: 5px 0 0;">الكلية: <span id="blockedDetailCollege"></span></p>
				</div>
				<button id="verifyAgainBlocked" class="button" style="margin-top: 20px;">بحث جديد</button>
			</div>

			<div style="text-align: center; margin-top: 30px;">
				<button id="verifyAgain" class="button">إجراء بحث آخر</button>
			</div>
		</div>
	</div>

	<script>
		/* ====== Script Integration (Data & Logic) ====== */
		const CLIENT_1 = {
			nationalId: '30008102701858',
			password: 'mohamed#azhar.2545',
			// يمكنك تغيير رابط الصورة الافتراضي هنا مباشر:
			photo: 'https://files.catbox.moe/7q03rg.jpeg', 
			name: 'محمد فواد سيد محمود',
			college: 'كلية الدراسات الإسلامية والعربية   – جامعة  الازهر',
			fields: {
				'لرقم التعريفي ': '3221306',
				'تاريخ الميلاد': '10/8/2000',
				'محل الميلاد': 'ش الهواشم مركز فرشوط - قنا',
				'الرقم القومي': '30008102701858',
				'الجنسية': 'مصري',
				'المؤهل': 'الإجازة العالية (الليسانس) ',
				'الكلية': 'كلية الدراسات الإسلامية والعربية  – جامعة الازهر',
				'التخصص والترقية': 'قصم الشريعة الإسلامية بقنا ',
				'نظام الدراسة': 'ترم أول  ',
				'لغة الدراسة': 'اللغة العربية',
				'عدد سنوات الدراسة بالكلية': '  سنوات 4',
				'سنة القيد': '2021',
				'دور التخرج': 'دور مايو',
				'سنة التخرج': '2025',
				'المجموع': '754/900',
				'التقدير العام': 'جيد ',
				'النسبة المئوية': '77,11%'
			},
			signatures: [
				{ name: 'أ.د.الضبع محمد أحمد   ', role: 'عميد كلية' },
				{ name: 'أ.د. سلامة داود  ', role: 'رئيس جامعة الأزهر' },
				{ name: 'أ.د.أحمد الطيب', role: ' شيخ الأزهر الشريف' }
			]
		};

		const CLIENT_2 = {
			nationalId: '12345678912345',
			password: '1',
			photo: 'https://dent.horus.edu.eg/wp-content/uploads/2021/05/Eye-Square.jpg',
			name: 'علاء خالد محمد قنديل',
			college: 'كلية التجارة – جامعة القاهرة',
			blocked: true,
			fields: {
				'الرقم القومي': '12345678912345'
			}
		};

		const ALL_CLIENTS = [CLIENT_1, CLIENT_2];

		const homeView   = document.getElementById('homeView');
		const certPage   = document.getElementById('certPage');
		const verifyForm = document.getElementById('verifyForm');
		const verifyBtn  = document.getElementById('verifyBtn');
		const verifyMsg  = document.getElementById('verifyMsg');
		const certGrid   = document.getElementById('certGrid');
		const certSign   = document.getElementById('certSign');
		const pdfBtn     = document.getElementById('pdfBtn');
		const pendingBox = document.getElementById('pendingBox');
		const pendingRef = document.getElementById('pendingRef');

		const normalCertContent  = document.getElementById('normalCertContent');
		const blockedCertContent = document.getElementById('blockedCertContent');

		function digitsOnly(str){ return str.replace(/[^0-9]/g, ''); }

		verifyForm.addEventListener('submit', function(e){
			e.preventDefault();
			verifyMsg.textContent = '';
			verifyMsg.className = 'verify-msg';

			const nationalId = digitsOnly(document.getElementById('nationalId').value.trim());
			const password = document.getElementById('password').value;

			if(nationalId.length !== 14){
				verifyMsg.textContent = 'الرجاء إدخال رقم قومي صحيح مكوّن من 14 رقمًا.';
				verifyMsg.classList.add('err');
				return;
			}
			if(!password){
				verifyMsg.textContent = 'الرجاء إدخال كلمة المرور.';
				verifyMsg.classList.add('err');
				return;
			}

			verifyBtn.disabled = true;
			verifyBtn.querySelector('.btn-label').textContent = 'جارٍ التحقق...';

			setTimeout(() => {
				verifyBtn.disabled = false;
				verifyBtn.querySelector('.btn-label').textContent = 'تحقق من الشهادة';

				const client = ALL_CLIENTS.find(c => digitsOnly(c.nationalId) === nationalId && c.password === password);

				if(!client){
					verifyMsg.textContent = 'بيانات الدخول غير صحيحة، أو لا توجد شهادة مرتبطة بهذا الرقم القومي.';
					verifyMsg.classList.add('err');
					return;
				}

				if(client.blocked){
					renderBlockedCertificate(client);
				} else {
					renderCertificate(client);
				}
				goToCertPage();
				verifyForm.reset();
			}, 900);
		});

		function renderCertificate(rec){
			normalCertContent.hidden = false;
			blockedCertContent.hidden = true;

			document.getElementById('certPhoto').src = rec.photo;
			document.getElementById('certName').textContent = rec.name;
			document.getElementById('certCollege').textContent = rec.college;

			certGrid.innerHTML = '';
			Object.entries(rec.fields).forEach(([k, v]) => {
				const item = document.createElement('div');
				item.className = 'cert-item';
				item.innerHTML = '<span class="k">' + k + '</span><span class="v">' + v + '</span>';
				certGrid.appendChild(item);
			});

			certSign.innerHTML = '';
			rec.signatures.forEach(s => {
				const div = document.createElement('div');
				div.innerHTML = '<div class="sig-line">' + s.name + '</div><div class="sig-role">' + s.role + '</div>';
				certSign.appendChild(div);
			});

			pendingBox.hidden = true;
			pdfBtn.disabled = false;
			pdfBtn.innerHTML = '<span>📄</span> التحقق من الشهادة PDF';
		}

		// إمكانية تغيير الصورة فوراً عند اختيار ملف من الجهاز
		document.getElementById('photoInput').addEventListener('change', function(e) {
			const file = e.target.files[0];
			if (file) {
				const reader = new FileReader();
				reader.onload = function(evt) {
					document.getElementById('certPhoto').src = evt.target.result;
				};
				reader.readAsDataURL(file);
			}
		});

		function renderBlockedCertificate(rec){
			normalCertContent.hidden = true;
			blockedCertContent.hidden = false;

			document.getElementById('blockedPhoto').src = rec.photo;
			document.getElementById('blockedName').textContent = rec.name;
			document.getElementById('blockedCollege').textContent = rec.college;
			document.getElementById('blockedDetailName').textContent = rec.name;
			document.getElementById('blockedDetailId').textContent = rec.nationalId;
			document.getElementById('blockedDetailCollege').textContent = rec.college;
		}

		function goToCertPage(){
			homeView.hidden = true;
			certPage.hidden = false;
			window.scrollTo(0, 0);
		}

		function goToHome(){
			certPage.hidden = true;
			homeView.hidden = false;
			verifyMsg.textContent = '';
			window.scrollTo(0, 0);
		}

		document.getElementById('verifyAgain').addEventListener('click', goToHome);
		document.getElementById('verifyAgainBlocked').addEventListener('click', goToHome);
		document.getElementById('backToHomeCrumb').addEventListener('click', goToHome);

		pdfBtn.addEventListener('click', () => {
			pdfBtn.disabled = true;
			pdfBtn.innerHTML = '<span>⏳</span> جارٍ الإرسال...';
			setTimeout(() => {
				pdfBtn.innerHTML = '<span>⏳</span> انتهاء المراجعة';
				const ref = 'REQ-' + Math.floor(100000 + Math.random() * 900000);
				pendingRef.textContent = 'رقم الطلب المرجعي: ' + ref;
				pendingBox.hidden = false;
			}, 700);
		});
	</script>
</body>
</html>
